name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release

      # The benchmark project is built above (it's in the solution) but never run in
      # CI — the middleware-overhead numbers are recorded in the README from local runs.
      - name: Pack (verify the package is publishable)
        run: dotnet pack src/ToSpec.Sdk/ToSpec.Sdk.csproj --no-build --configuration Release
